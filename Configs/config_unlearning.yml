# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
log_dir: "Models/Unlearning"            # Base directory for run logs / checkpoints
pretrained_model: "Models/LibriTTS/epochs_2nd_00020.pth"
second_stage_load_pretrained: true      # Must be true; unlearning builds on a 2nd-stage checkpoint
load_only_params: true                  # Load weights only (ignore saved epoch / optimizer state)

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: "Utils/PLBERT/"

# ---------------------------------------------------------------------------
# Training schedule
# ---------------------------------------------------------------------------
epochs: 10          # Number of fine-tuning epochs
batch_size: 32
save_freq: 1        # Save a checkpoint every N epochs
log_interval: 10    # (unused by train.py directly, kept for reference)
max_len: 400        # Maximum number of frames (unused at fine-tuning stage)

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data_params:
  # dataset_path : CSV with columns (filepath, text, speaker_id, speaker_dir)
  #                where filepath points to a pre-computed style vector (.pt).
  dataset_path: "/path/to/train/diffusion_data.csv"

  # forget_speaker_file : CSV with a 'speaker_files' column listing .wav paths
  #                       for the speaker to be forgotten.
  forget_speaker_file: "/path/to/train/forget_speaker_train.csv"

  # forget_ratio : probability [0, 1] of replacing the reference speaker with
  #                a forget-speaker sample during training.
  forget_ratio: 0.5

  # Standard StyleTTS2 data params (used for dataloader construction)
  train_data: "Data/train_list.txt"
  val_data: "Data/val_list.txt"
  root_path: "/path/to/LibriTTS/wavs"
  style_root_path: "/path/to/style_vectors"
  OOD_data: "Data/OOD_texts.txt"
  min_length: 50

  num_workers: 2
  val_size: 0.05      # Fraction of dataset_path held out for validation
  random_state: 42

# ---------------------------------------------------------------------------
# Pre-processing
# ---------------------------------------------------------------------------
preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

# ---------------------------------------------------------------------------
# Model architecture
# (Keep identical to the pretrained model you are fine-tuning from.)
# ---------------------------------------------------------------------------
model_params:
  multispeaker: true

  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80

  n_token: 178      # Number of phoneme tokens
  max_dur: 50       # Maximum duration of a single phoneme
  style_dim: 128    # Style vector dimensionality

  dropout: 0.2

  decoder:
    type: "hifigan"
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [10, 5, 3, 2]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_kernel_sizes: [20, 10, 6, 4]

  slm:
    model: "microsoft/wavlm-base-plus"
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2           # Placeholder; overwritten when estimate_sigma_data=true
      estimate_sigma_data: true # Estimate sigma_data from each training batch
      mean: -3.0
      std: 1.0

# ---------------------------------------------------------------------------
# Loss weights
# ---------------------------------------------------------------------------
loss_params:
  # Core unlearning losses (both modes)
  lambda_diff: 1.0    # EDM diffusion score-matching loss
  lambda_sty: 1.0     # L1 style reconstruction loss

  # Triplet loss (triplet mode only — ignored by standard mode)
  lambda_triplet: 1.0
  margin: 0.3         # Triplet margin (Euclidean distance)

  # Legacy fields kept for compatibility with load_checkpoint
  diff_epoch: 0
  joint_epoch: 0
  lambda_mel: 5.0
  lambda_gen: 1.0
  lambda_slm: 1.0
  lambda_mono: 1.0
  lambda_s2s: 1.0
  lambda_F0: 1.0
  lambda_norm: 1.0
  lambda_dur: 1.0
  lambda_ce: 20.0

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimizer_params:
  lr: 0.0001          # General learning rate
  bert_lr: 0.00001    # Learning rate for PL-BERT encoder
  ft_lr: 0.0001       # Learning rate for acoustic fine-tuning modules

# ---------------------------------------------------------------------------
# Weights & Biases logging
# ---------------------------------------------------------------------------
wandb:
  enable: true
  project: "styletts2-unlearning"
  # name: "my-run"    # Optional; defaults to a timestamp + mode suffix
